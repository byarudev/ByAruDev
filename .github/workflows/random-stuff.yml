name: 🎲 Update Random Stuff

on:
  schedule:
    
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-random-stuff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update random activity
        run: |
          python <<'PY'
          import random
          import re
          from pathlib import Path

          readme = Path("README.md")

          activities = [
              "Designed a random poster and somehow spent way too long on it.",
              "Worked on a project that I probably should have finished weeks ago.",
              "Experimented with a completely unnecessary UI animation.",
              "Refactored some code that was working perfectly fine.",
              "Started another project instead of finishing the previous one.",
              "Spent way too long choosing the perfect font.",
              "Built something just because I wanted to see if I could.",
              "Fixed a bug that I accidentally created five minutes earlier.",
              "Played around with Three.js and made something unnecessarily 3D.",
              "Experimented with a new color palette for a project.",
              "Made a small improvement to one of my websites.",
              "Designed a UI for an idea that may or may not become a real project.",
              "Added an animation that absolutely did not need to exist.",
              "Cleaned up some old project files and immediately created more.",
              "Learned something new and immediately tried using it in a project.",
              "Worked on some backend code and questioned every life decision.",
              "Made a tiny change that somehow took an entire afternoon.",
              "Experimented with a new GitHub README idea.",
              "Built something random instead of doing what I was supposed to do.",
              "Opened an old project and decided it needed a complete redesign.",
              "Worked on a side project at an unreasonable hour.",
              "Made a button unnecessarily satisfying to click.",
              "Added another project to the pile of projects I need to finish.",
              "Tried a new developer tool just because it looked interesting.",
              "Spent more time debugging than actually coding.",
              "Designed something that started as a five-minute idea.",
              "Worked on a random feature nobody asked for.",
              "Made some questionable UI decisions and called them experimental.",
              "Improved a project by approximately 3% and celebrated anyway.",
              "Wrote code, broke code, fixed code. Classic."
          ]

          new_activity = random.choice(activities)

          content = readme.read_text(encoding="utf-8")

          pattern = (
              r"(<!-- RANDOM_STUFF_START -->\s*)"
              r".*?"
              r"(\s*<!-- RANDOM_STUFF_END -->)"
          )

          replacement = (
              r"\1"
              + "> ✨ "
              + new_activity
              + r"\2"
          )

          updated, count = re.subn(
              pattern,
              replacement,
              content,
              count=1,
              flags=re.DOTALL
          )

          if count == 0:
              raise SystemExit(
                  "Could not find RANDOM_STUFF_START / RANDOM_STUFF_END markers."
              )

          readme.write_text(updated, encoding="utf-8")

          print(f"Updated Random Stuff to: {new_activity}")
          PY

      - name: Commit changes
        run: |
          git config user.name "ByAruDev"
          git config user.email "306573599+byarudev@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🎲 Update random stuff"
            git push
          fi
