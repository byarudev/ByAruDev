name: 📊 Update Profile Statistics

on:
  schedule:
    - cron: "0 3 * * *"
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📈 Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ByAruDev&show_icons=true&theme=transparent&hide_border=true&rank_icon=github
          path: profile/stats.svg


      - name: 💻 Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ByAruDev&layout=donut&theme=transparent&hide_border=true&langs_count=8
          path: profile/top-langs.svg


      - name: 🔥 Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=ByAruDev&theme=transparent&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: 🏆 Generate GitHub Trophies
        run: |
          curl -L \
            "https://github-profile-trophy.vercel.app/?username=ByAruDev&theme=darkhub&no-frame=true&margin-w=10&row=1" \
            -o /tmp/trophies.svg

          # Make sure we actually received SVG
          if ! grep -q "<svg" /tmp/trophies.svg; then
            echo "Trophy generator did not return valid SVG"
            cat /tmp/trophies.svg
            exit 1
          fi

          # Remove potentially problematic XML declarations/doctype
          sed -i '/<\?xml/d' /tmp/trophies.svg
          sed -i '/<!DOCTYPE/d' /tmp/trophies.svg

          cp /tmp/trophies.svg profile/trophies.svg
          

      - name: 💾 Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "📊 Update profile statistics"
            git push
          fi
